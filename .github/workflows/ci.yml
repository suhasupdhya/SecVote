name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build && forge test -vv
        working-directory: packages/contracts

  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - working-directory: apps/api
        run: |
          uv sync
          uv run ruff check src tests
          uv run mypy
          uv run pytest
          uv run pytest -m chain
          uvx pip-audit || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secvote/shared lint && pnpm --filter @secvote/shared test
      - run: pnpm --filter @secvote/verifier lint
      - run: pnpm --filter web lint && pnpm --filter web test && pnpm --filter web build

  e2e:
    runs-on: ubuntu-latest
    needs: [contracts, api, web]
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile && (cd apps/api && uv sync)
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
