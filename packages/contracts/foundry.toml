[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@semaphore-protocol/contracts/=node_modules/@semaphore-protocol/contracts/",
  "@zk-kit/lean-imt.sol=node_modules/@zk-kit/lean-imt.sol",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 110

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable", "mixed-case-function"]
